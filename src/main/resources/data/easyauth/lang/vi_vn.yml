text:
  easyauth:
    # Password
    password:
      enter: "§6Vui lòng nhập mật khẩu!"
      enterNew: "§4Vui lòng nhập mật khẩu mới!"
      incorrect: "§4Sai mật khẩu!"
      mismatch: "§6Hai mật khẩu phải trùng khớp!"
      changed: "§aMật khẩu của bạn đã được cập nhật thành công!"
      tooLong: "§6Mật khẩu không được vượt quá %d kí tự!"
      tooShort: "§6Mật khẩu phải chứa ít nhất %d kí tự!"
      cannotChange: "§cBạn không thể đổi mật khẩu!"
      globalSet: "§aMật khẩu toàn cục đã được thiết lập thành công!"
      globalIncorrect: "§4Mật khẩu toàn cục không khớp!"
    # Session
    session:
      loginRequired: "§cBạn chưa đăng nhập!\n§6Nhập /login hoặc /l để đăng nhập."
      tooManyAttempts: "§4 Bạn đã thử đăng nhập quá nhiều lần!  Vui lòng thử lại sau vài phút."
      notAuthenticated: "§cBạn chưa đăng nhập!\n§6Nhập /login, /l, hoặc /register."
      alreadyAuthenticated: "§6Bạn đã đăng nhập."
      loginSuccess: "§aBạn đã đăng nhập thành công."
      logoutSuccess: "§aBạn đã đăng xuất thành công."
      cannotLogout: "§cBạn không thể đăng xuất!"
      timeExpired: "§cThời gian đăng nhập đã hết hạn."
      valid: "§aBạn đang có phiên hợp lệ. Không cần đăng nhập"
      onlineAccount: "§aBạn đang sử dụng tài khoản trực tuyến. Không cần đăng nhập."
    # Registration
    registration:
      required: "§6Nhập /register <mật khẩu> <mật khẩu> để sở hữu tài khoản này."
      requiredWithGlobalPassword: "§6Nhập /register <mật khẩu toàn cục> <mật khẩu> <mật khẩu> để sở hữu tài khoản này."
      alreadyRegistered: "§6Tên tài khoản này đã được đăng kí bởi người khác!"
      success: "§aBạn đã đăng kí thành công"
      notRegistered: "§cNgười chơi này chưa đăng kí!"
    # Account
    account:
      cannotUnregister: "§cBạn không thể hủy đăng ký tài khoản này!"
      deleted: "§aĐã xóa thành công tài khoản của bạn!"
      dataDeleted: "§aĐã xóa dữ liệu người dùng."
      dataUpdated: "§aĐã cập nhật dữ liệu người dùng."
      dataCorrupted: "§cDữ liệu của bạn có thể đã bị hư hại. Vui lòng liên hệ quản trị viên (admin)"
      usernameInvalid: "§6Tên người dùng chứa kí tự không hợp lệ! Mẫu được cho phép: %s"
      usernameCaseMismatch: "§6Bạn đang sử dụng kiểu chữ khác cho tên người dùng của mình. Vui lòng sử dụng đúng kiểu chữ."
      alreadyOnline: "§cNgười chơi %s đang trực tuyến!"
      markedSelfOnline: "§aBạn đã tự đánh dấu bản thân là người chơi trực tuyến."
      markSelfOnlineWarning: "§6Bạn đang tự đánh dấu bản thân là người chơi trực tuyến.\n§6 Bạn sẽ KHÔNG THỂ đăng nhập trừ khi bạn sử dụng tài khoản trực tuyến.\n§6Mọi dữ liệu được liên kết đến UUID ngoại tuyến (ví dụ như dân làng giảm giá, thú nuôi, v.v) sẽ bị mất.\n§aĐể tiếp tục thực hiện hành động này, nhập /account online <mật khẩu> true."
      onlineNotFound: "§cTài khoản ngoại tuyến không được tìm thấy."
    # Uuid
    uuid:
      offline: "UUID ngoại tuyến của người chơi %s (nhấn để sao chép):\n%s"
    # Admin
    admin:
      configReloaded: "§aTệp cấu hình (config) đã được tải lại."
      spawnSet: "§aĐiểm hồi sinh đã được thiết lập."
      registeredPlayers: "Danh sách người chơi đã đăng kí:"
      markedOffline: "§aNgười chơi %s đã được đánh dấu là người chơi ngoại tuyến."
      markedOnline: "§aNgười chơi %s đã được đánh dấu là người chơi trực tuyến."
    # Error
    error:
      mojangUnavailable: "§cKhông thể kết nối đến máy chủ Mojang. Vui lòng thử lại sau."
