##                             ##
##          EasyAuth           ##
##    Telegram Integration     ##
##                             ##

# Enable or disable Telegram integration functionality
enabled = ${enabled}

# Your Telegram Bot token (obtained from BotFather)
# Keep this secret and never share publicly!
bot-token = "${botToken}"

# Database settings
database {
    # Table name for Telegram links
    table-name = "${databaseTableName}"
}

# Code settings
code {
    # Length of generated verification codes
    length = ${codeLength}
    
    # Verification code validity in minutes
    expiration-minutes = ${codeExpirationMinutes}
    
    # Maximum daily link attempts per player
    max-daily-attempts = ${maxDailyAttempts}
}

# Security settings
security {
    # Time in hours before allowing link attempt after failed attempts limit
    cooldown-hours = ${cooldownHours}
} 