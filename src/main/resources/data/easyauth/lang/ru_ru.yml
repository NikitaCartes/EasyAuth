text:
  easyauth:
    # Password
    password:
      enter: "§6Пожалуйста, введите пароль!"
      enterNew: "§4Пожалуйста, введите новый пароль!"
      incorrect: "§4Неверный пароль!"
      mismatch: "§6Пароли должны совпадать!"
      changed: "§aПароль успешно обновлён!"
      tooLong: "§6Максимальная длина пароля — %d символов!"
      tooShort: "§6Минимальная длина пароля — %d символов!"
      cannotChange: "§cВы не можете изменить пароль!"
      globalSet: "§aГлобальный пароль успешно установлен!"
      globalIncorrect: "§4Неверный глобальный пароль!"
    # Session
    session:
      loginRequired: "§cВы не авторизованы!\n§6Используйте /login или /l для входа."
      tooManyAttempts: "§4Слишком много попыток входа. Подождите немного и попробуйте снова."
      notAuthenticated: "§cВы не авторизованы!\n§6Используйте /login, /l или /register."
      alreadyAuthenticated: "§6Вы уже авторизованы."
      loginSuccess: "§aВы успешно авторизованы."
      logoutSuccess: "§aВы вышли из аккаунта."
      cannotLogout: "§cВы не можете выйти из аккаунта!"
      timeExpired: "§cВремя на авторизацию истекло."
      valid: "§aУ вас активная сессия. Вход не требуется."
      onlineAccount: "§aВы используете онлайн-аккаунт. Вход не требуется."
    # Registration
    registration:
      required: "§6Введите /register <пароль> <пароль> для регистрации."
      requiredWithGlobalPassword: "§6Введите /register <глобальный пароль> <пароль> <пароль> для регистрации."
      alreadyRegistered: "§6Этот аккаунт уже зарегистрирован!"
      success: "§aВы успешно авторизованы."
      notRegistered: "§cЭтот игрок не зарегистрирован!"
    # Account
    account:
      cannotUnregister: "§cВы не можете удалить этот аккаунт!"
      deleted: "§aВаш аккаунт успешно удалён!"
      dataDeleted: "§aДанные пользователя удалены."
      dataUpdated: "§aДанные пользователя обновлены."
      dataCorrupted: "§cВозможно, ваши данные повреждены. Обратитесь к администратору."
      usernameInvalid: "§6Никнейм содержит недопустимые символы! Разрешённый шаблон: %s"
      usernameCaseMismatch: "§6Вы используете другой регистр в никнейме. Пожалуйста, используйте правильный."
      alreadyOnline: "§cИгрок %s уже на сервере!"
      markedSelfOnline: "§aВы пометили себя как онлайн-игрока."
      markSelfOnlineWarning: "§6Вы собираетесь пометить себя как онлайн-игрока.\n§6Вы не сможете войти, если у вас нет онлайн-аккаунта.\n§6Данные, связанные с оффлайн UUID (скидки у жителей, питомцы и т.д.), будут утеряны.\n§aЕсли вы хотите продолжить, введите /account online <пароль> true."
      onlineNotFound: "§cОнлайн-аккаунт не найден."
    # Uuid
    uuid:
      offline: "Оффлайн UUID для игрока %s (нажмите для копирования):\n%s"
      forcedSet: "§aПринудительный UUID для игрока §e%s §aустановлен на §e%s§a. Игрок будет кикнут для применения изменений."
      forcedCleared: "§aПринудительный UUID для игрока §e%s §aсброшен. При следующем входе будет использован UUID по умолчанию."
      changed: "§6Ваш UUID был изменён администратором. Пожалуйста, переподключитесь."
      invalidFormat: "§cНеверный формат UUID: §e%s§c. Используйте формат: 12345678-1234-1234-1234-123456789abc"
      noForced: "§cУ игрока §e%s §cнет принудительно установленного UUID."
    # Admin
    admin:
      configReloaded: "§aФайл конфигурации успешно перезагружен."
      spawnSet: "§aТочка спавна для входа успешно установлена."
      registeredPlayers: "Список зарегистрированных игроков:"
      markedOffline: "§aИгрок %s помечен как оффлайн."
      markedOnline: "§aИгрок %s помечен как онлайн."
      ipLimitNotify: "§e[EasyAuth] §cПревышение лимита IP: §fИгрок §e%s §fс IP §e%s §fпревысил лимит в §e%d §fаккаунтов. Существующие аккаунты: §e%s"
    # Error
    error:
      unknown: "§4Произошла неизвестная ошибка."
      database: "§4Ошибка базы данных, подробности в консоли."
      mojangUnavailable: "§cСервер Mojang недоступен. Повторите попытку позже."
      ipLimitExceeded: "§4Слишком много аккаунтов с вашего IP-адреса. Максимально допустимо: %d аккаунтов на один IP."
      sessionLimitExceeded: "§4Слишком много подключений с вашего IP-адреса. Попробуйте позже."
