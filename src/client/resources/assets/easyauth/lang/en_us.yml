# ModMenu
modmenu:
  summaryTranslation:
    easyauth: "Chat automation and auto-login for EasyAuth servers."
  descriptionTranslation:
    easyauth: "Client-side companion for EasyAuth: per-server chat/command automation rules and auto-login, with optional TOTP codes."
easyauthclient:
  config:
    title: "EasyAuth Client"
    # Server entry
    server: "Server"
    newServer: "+ Add server"
    address: "Server address"
    password: "Password"
    password.tooltip: "Stored encrypted in credentials.json. Clear this field to forget the server."
    show: "Show"
    hide: "Hide"
    locked: "(locked)"
    totp: "TOTP secret (Base32, optional)"
    totp.tooltip: "Enables automatic {otp} codes. Storing the secret here makes this computer the second factor."
    autoLogin: "Auto-login"
    autoRegister: "Auto-register (sets the account password!)"
    edit: "Edit"
    remove: "Remove"
    noPassword: "(no password)"
    # Global settings
    globalSettings: "Global settings"
    globalAutoLogin: "Auto-login (all servers)"
    globalAutoLogin.tooltip: "Send /login automatically on servers that have the command and a saved password."
    globalAutoRegister: "Auto-register (new servers)"
    globalAutoRegister.tooltip: "On servers with a /register command and no saved password, register with the default password (or a random one) and remember it."
    useSessionToken: "Session tokens"
    useSessionToken.tooltip: "\"Remember me\": after a successful login the server issues a one-time-rotating token, used instead of the password on the next join. EasyAuth 4.0+ servers only."
    usePasskey: "Passkeys"
    usePasskey.tooltip: "Ed25519 challenge-response login: a key pair is generated per server and the secret never leaves this computer. EasyAuth 4.0+ servers only."
    clearKeys: "Forget session token & passkey"
    clearKeys.tooltip: "Removes the stored session token and the local passkey pair for this server. The next login uses the password again."
    defaultPassword: "Default password for new servers"
    defaultPassword.tooltip: "Used by auto-register. Leave empty to generate a random password per server."
    # Commands
    loginCommand: "Login command"
    loginCommand.tooltip: "Template for the built-in auto-login, e.g. /login {password}. Its first word is also what is looked for in the server's command tree. {otp} is appended automatically when a TOTP secret is set and no separate 2FA command is configured."
    registerCommand: "Register command"
    registerCommand.tooltip: "Template for the built-in auto-register, e.g. /register {password} {password}. Its first word is also what is looked for in the server's command tree."
    totpCommand: "2FA command"
    totpCommand.tooltip: "For servers whose login command takes no code, e.g. /totp code {otp} on AuthMe. Sent shortly after the login command when a TOTP secret is set. Leave empty to append {otp} to the login command instead (EasyAuth's own syntax)."
    # Server tags
    tag:
      noAutoLogin: "no auto-login"
      autoRegister: "auto-register"
    # Misc
    rulesHint: "Auto-input rules: %s"
    serverShortcut: "EasyAuth: auto-login and rules for this server"
  unlock:
    title: "Unlock EasyAuth credentials"
    password: "Master password"
    unlock: "Unlock"
    skip: "Not now"
    wrong: "Wrong password"
  storage:
    title: "Storage & security"
    dataDir: "Data folder"
    dataDir.tooltip: "Where credentials.json and rules.json live. Empty = this instance's config folder. Point several instances at the same folder to share servers, rules and passwords; a store that already exists there is adopted as-is."
    keyFile: "Key file"
    keyFile.tooltip: "The encryption key for stored secrets. Empty = this instance's config folder. Use the Home folder button to keep the key outside the instance, so an exported or synced config folder contains only ciphertext. On Windows the key is additionally protected with DPAPI (tied to your OS account)."
    useHome: "Home folder"
    setPassword: "Set master password"
    changePassword: "Change master password"
    removePassword: "Remove master password (automatic key)"
    newPassword: "New master password"
    repeatPassword: "Repeat master password"
    passwordEmpty: "Password cannot be empty"
    mismatch: "Passwords do not match"
    passwordSet: "Master password set — you will be asked once per game launch"
    passwordRemoved: "Master password removed"
    keyUnavailable: "The key file cannot be read on this computer; stored secrets are locked"
    moveFailed: "Could not switch the storage location (see the log)"
    disableEncryption: "Disable encryption (store as plain text)"
    disableEncryption.tooltip: "Passwords, TOTP secrets, session tokens and passkeys are written to credentials.json as readable text. Anyone with access to the file can use them."
    enableEncryption: "Enable encryption"
    plaintextWarning: "Stored secrets are NOT encrypted"
    encryptionEnabled: "Encryption enabled — stored secrets were re-encrypted"
    encryptionDisabled: "Encryption disabled — secrets are stored as plain text"
