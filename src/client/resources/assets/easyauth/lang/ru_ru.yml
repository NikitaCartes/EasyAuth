# ModMenu
modmenu:
  summaryTranslation:
    easyauth: "Автоматизация чата и автовход для серверов с EasyAuth."
  descriptionTranslation:
    easyauth: "Клиентский компаньон для EasyAuth: правила авто-ввода команд по серверам и автовход, опционально с TOTP-кодами."
easyauthclient:
  config:
    title: "EasyAuth Client"
    # Server entry
    server: "Сервер"
    newServer: "+ Добавить сервер"
    address: "Адрес сервера"
    password: "Пароль"
    password.tooltip: "Хранится в credentials.json в зашифрованном виде. Очистите поле, чтобы забыть сервер."
    show: "Показать"
    hide: "Скрыть"
    locked: "(заблокировано)"
    totp: "TOTP-секрет (Base32, необязательно)"
    totp.tooltip: "Включает автоподстановку {otp}. Секрет на этом компьютере делает его вторым фактором."
    autoLogin: "Автовход"
    autoRegister: "Авторегистрация (устанавливает пароль аккаунта!)"
    edit: "Изменить"
    remove: "Удалить"
    noPassword: "(без пароля)"
    # Global settings
    globalSettings: "Общие настройки"
    globalAutoLogin: "Автовход (все серверы)"
    globalAutoLogin.tooltip: "Автоматически отправлять /login на серверах, где есть эта команда и сохранён пароль."
    globalAutoRegister: "Авторегистрация (новые серверы)"
    globalAutoRegister.tooltip: "На серверах с командой /register и без сохранённого пароля — зарегистрироваться с паролем по умолчанию (или случайным) и запомнить его."
    useSessionToken: "Сессионные токены"
    useSessionToken.tooltip: "«Запомнить меня»: после успешного входа сервер выдаёт одноразово-ротируемый токен, который используется вместо пароля при следующем входе. Только для серверов с EasyAuth 4.0+."
    usePasskey: "Паскеи (passkey)"
    usePasskey.tooltip: "Вход по Ed25519 challenge-response: пара ключей создаётся для каждого сервера, секрет не покидает этот компьютер. Только для серверов с EasyAuth 4.0+."
    clearKeys: "Забыть токен и паскей"
    clearKeys.tooltip: "Удаляет сохранённый сессионный токен и локальную пару ключей для этого сервера. Следующий вход снова использует пароль."
    defaultPassword: "Пароль по умолчанию для новых серверов"
    defaultPassword.tooltip: "Используется авторегистрацией. Оставьте пустым — для каждого сервера будет сгенерирован случайный пароль."
    # Commands
    loginCommand: "Команда входа"
    loginCommand.tooltip: "Шаблон встроенного автовхода, например /login {password}. Первое слово — это ещё и команда, которую мод ищет в дереве команд сервера. {otp} добавляется автоматически, если задан TOTP-секрет и не настроена отдельная команда 2FA."
    registerCommand: "Команда регистрации"
    registerCommand.tooltip: "Шаблон встроенной авторегистрации, например /register {password} {password}. Первое слово — это ещё и команда, которую мод ищет в дереве команд сервера."
    totpCommand: "Команда 2FA"
    totpCommand.tooltip: "Для серверов, чья команда входа не принимает код, например /totp code {otp} на AuthMe. Отправляется вскоре после команды входа, если задан TOTP-секрет. Оставьте пустым, чтобы вместо этого добавлять {otp} к команде входа (синтаксис самого EasyAuth)."
    # Server tags
    tag:
      noAutoLogin: "без автовхода"
      autoRegister: "авторегистрация"
    # Misc
    serverShortcut: "EasyAuth: автовход и правила для этого сервера"
  rules:
    title: "Правила авто-ввода"
    newRule: "+ Добавить правило"
    editRule: "Изменить правило"
    joinHint: "Изменения применятся при следующем входе на сервер"
    trigger: "Триггер: %s"
    trigger.tooltip: "Когда срабатывает правило: при входе, по сообщению в чате, по таймеру или при выходе с сервера."
    trigger.join: "Вход"
    trigger.chat: "Чат"
    trigger.timer: "Таймер"
    trigger.leave: "Выход"
    source: "Чат от: %s"
    source.tooltip: "Только для триггера «Чат»: какие сообщения проверяются."
    source.any: "Любых"
    source.system: "Системы"
    source.player: "Игроков"
    match: "Совпадение (regex)"
    match.tooltip: "Только для триггера «Чат»: регулярное выражение, которое ищется в любом месте сообщения. Правило без него игнорируется."
    send: "Отправить (строки через |)"
    send.tooltip: "Строки для отправки, разделённые |. Строка, начинающаяся с /, отправляется как команда. Подстановки: {username}, {server}, {password}, {otp}."
    delay: "Задержка, мс"
    delay.tooltip: "Подождать столько перед отправкой. Для триггера «Таймер» — задержка до первого срабатывания."
    cooldown: "Перезарядка, мс"
    cooldown.tooltip: "Минимальное время между двумя срабатываниями. Для триггера «Таймер» — это период; правило без него игнорируется."
    maxRuns: "Макс. срабатываний"
    maxRuns.tooltip: "Сколько раз правило может сработать за сессию. -1 — без ограничений."
  unlock:
    title: "Разблокировать данные EasyAuth"
    password: "Мастер-пароль"
    unlock: "Разблокировать"
    skip: "Не сейчас"
    wrong: "Неверный пароль"
  storage:
    title: "Хранилище и защита"
    dataDir: "Папка данных"
    dataDir.tooltip: "Где лежат credentials.json и rules.json. Пусто = папка config этого инстанса. Укажите одну папку в нескольких инстансах, чтобы разделять серверы, правила и пароли; уже существующее там хранилище подхватывается как есть."
    keyFile: "Файл ключа"
    keyFile.tooltip: "Ключ шифрования сохранённых секретов. Пусто = папка config этого инстанса. Кнопка «Домашняя папка» выносит ключ за пределы инстанса, чтобы в экспортированной или синхронизируемой папке config оставался только шифротекст. На Windows ключ дополнительно защищён DPAPI (привязан к учётной записи ОС)."
    useHome: "Домашняя папка"
    setPassword: "Установить мастер-пароль"
    changePassword: "Сменить мастер-пароль"
    removePassword: "Убрать мастер-пароль (автоматический ключ)"
    newPassword: "Новый мастер-пароль"
    repeatPassword: "Повторите мастер-пароль"
    passwordEmpty: "Пароль не может быть пустым"
    mismatch: "Пароли не совпадают"
    passwordSet: "Мастер-пароль установлен — он будет запрашиваться раз за запуск игры"
    passwordRemoved: "Мастер-пароль убран"
    keyUnavailable: "Файл ключа не читается на этом компьютере; сохранённые секреты заблокированы"
    moveFailed: "Не удалось сменить расположение хранилища (см. лог)"
    disableEncryption: "Отключить шифрование (хранить открытым текстом)"
    disableEncryption.tooltip: "Пароли, TOTP-секреты, сессионные токены и паскеи записываются в credentials.json в читаемом виде. Любой, у кого есть доступ к файлу, сможет ими воспользоваться."
    enableEncryption: "Включить шифрование"
    plaintextWarning: "Сохранённые секреты НЕ зашифрованы"
    encryptionEnabled: "Шифрование включено — сохранённые секреты снова зашифрованы"
    encryptionDisabled: "Шифрование отключено — секреты хранятся открытым текстом"
