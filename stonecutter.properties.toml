# Central Stonecutter properties — replaces the per-node versions/*/gradle.properties files.
# Top-level keys apply to every node; [<loader>."<version>"] sections apply to that node only.
# Build scripts read these via property("...") after calling properties.tags(version, loader).

# Mod
mod_name = "EasyAuth"
mod_id = "easyauth"
mod_version = "4.0.0-SNAPSHOT"

# Shared dependencies
luckperms_version = "5.4"
bcrypt_version = "0.10.2"
bytes_version = "1.6.1"
mongodb_version = "5.3.1"
mysql_version = "9.2.0"
sqlite_version = "3.49.1.0"
postgresql_version = "42.7.10"
hocon_version = "4.2.0"

