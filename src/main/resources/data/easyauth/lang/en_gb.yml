text:
  easyauth:
    # Password
    password:
      enter: "§6Please enter your password!"
      enterNew: "§4Please enter a new password!"
      incorrect: "§4Incorrect password!"
      mismatch: "§6Passwords must match!"
      changed: "§aYour password has been updated successfully!"
      tooLong: "§6Password can be at most %d characters long!"
      tooShort: "§6Password must be at least %d characters long!"
      cannotChange: "§cYou cannot change the password!"
      globalSet: "§aGlobal password has been set successfully!"
      globalIncorrect: "§4Incorrect global password!"
    # Session
    session:
      loginRequired: "§cYou are not authorised!\n§6Use /login or /l to authenticate."
      tooManyAttempts: "§4Too many login attempts. Please wait a few minutes and try again."
      notAuthenticated: "§cYou are not authorised!\n§6Use /login, /l, or /register."
      alreadyAuthenticated: "§6You are already authorised."
      loginSuccess: "§aYou are now authorised."
      logoutSuccess: "§aYou have logged out successfully."
      cannotLogout: "§cYou cannot log out!"
      timeExpired: "§cAuthentication time has expired."
      valid: "§aYou have a valid session. No need to log in."
      onlineAccount: "§aYou are using an online account. No need to log in."
      otpRequired: "§6This account is protected by two-factor authentication.\n§6Use /login <password> <code> with the code from your authenticator app."
      otpIncorrect: "§4Incorrect two-factor code!"
    # Registration
    registration:
      required: "§6Use /register <password> <password> to claim this account."
      requiredWithGlobalPassword: "§6Use /register <global password> <password> <password> to claim this account."
      alreadyRegistered: "§6This account name is already registered!"
      success: "§aYou are now authorised."
      notRegistered: "§cThis player is not registered!"
    # Account
    account:
      cannotUnregister: "§cYou cannot unregister this account!"
      deleted: "§aYour account has been deleted successfully!"
      dataDeleted: "§aUser data has been deleted."
      dataUpdated: "§aUser data has been updated."
      dataCorrupted: "§cYour data may be corrupted. Please contact an administrator."
      usernameInvalid: "§6Invalid characters in username! Allowed pattern: %s"
      usernameCaseMismatch: "§6You are using a different case for your username. Please use the correct one."
      alreadyOnline: "§cPlayer %s is already online!"
      markedSelfOnline: "§aYou have marked yourself as an online player."
      markSelfOnlineWarning: "§6You are about to mark yourself as an online player.\n§6You will not be able to log in unless you have an online account.\n§6All data linked to the offline UUID (like villagers' discounts, pets) will be lost.\n§aTo proceed, type /account online <password> true."
      onlineNotFound: "§cOnline account not found."
      sessionCurrent: "§6Your session length is %d seconds. (0 = server default, -1 = log in every time)"
      sessionSet: "§aYour session length is now %d seconds. (0 = server default, -1 = log in every time)\n§7Values longer than the server limit are capped to it."
      sessionInvalid: "§cSession length must be a whole number of seconds."
      dialogEnabled: "§aThe login window will be shown when you join."
      dialogDisabled: "§aYou will use the chat login prompt instead of the window."
      settingsSaved: "§aYour settings have been saved."
      otpStatusEnabled: "§aTwo-factor authentication is enabled on your account."
      otpStatusDisabled: "§6Two-factor authentication is disabled. Use /account otp enable to set it up."
      otpFeatureDisabled: "§cTwo-factor authentication is disabled on this server."
      otpAlreadyEnabled: "§6Two-factor authentication is already enabled on your account."
      otpSetup: "§6Scan the link below in an authenticator app (Google Authenticator, Aegis, …), or enter the secret manually. Then confirm with /account otp enable <code>:"
      otpSecretLabel: "§7Secret: "
      otpNoPending: "§6Run /account otp enable first to start setup."
      otpInvalidCode: "§4Invalid code. Please try again."
      otpEnabled: "§aTwo-factor authentication is now enabled on your account."
      otpNotEnabled: "§6Two-factor authentication is not enabled on your account."
      otpDisabled: "§aTwo-factor authentication has been disabled."
      otpReset: "§aTwo-factor authentication has been reset for player §e%s§a."
    # Uuid
    uuid:
      offline: "Offline UUID for player %s (click to copy):\n%s"
      forcedSet: "§aForced UUID for player §e%s §ahas been set to §e%s§a. The player will be kicked to apply changes."
      forcedCleared: "§aForced UUID for player §e%s §ahas been cleared. The player will use the default UUID on next login."
      changed: "§6Your UUID has been changed by an administrator. Please reconnect."
      invalidFormat: "§cInvalid UUID format: §e%s§c. Please use the format: 12345678-1234-1234-1234-123456789abc"
      noForced: "§cPlayer §e%s §cdoes not have a forced UUID set."
      collision: "§cUUID §e%s §cis already used by player §e%s§c."
    # Admin
    admin:
      configReloaded: "§aConfiguration file reloaded successfully."
      spawnSet: "§aLogin spawn point has been set successfully."
      registeredPlayers: "List of registered players:"
      markedOffline: "§aPlayer %s has been marked as offline."
      markedOnline: "§aPlayer %s has been marked as online."
      ipLimitNotify: "§e[EasyAuth] §cIP Limit Warning: §fPlayer §e%s §ffrom IP §e%s §fexceeded the limit of §e%d §faccounts. Existing accounts: §e%s"
      databaseUnavailable: "§e[EasyAuth] §4Database unavailable after reload — logins and registrations are locked until it is restored."
    # Error
    error:
      unknown: "§4An unknown error has occurred."
      database: "§4Database error, see console for details."
      hasher: "§4Hasher error, see console for details."
      mojangUnavailable: "§cMojang server is unavailable. Please try again later."
      ipLimitExceeded: "§4Too many accounts from your IP address. Maximum allowed: %d accounts per IP."
      sessionLimitExceeded: "§4Too many connections from your IP address. Please try again later."
    # Dialog
    dialog:
      cancel: "Cancel"
      login:
        title: "Login"
        prompt: "§6Welcome back! Enter your password to log in."
        password: "Password"
        otp: "2FA code"
        submit: "Log in"
      otp:
        setupTitle: "Two-factor authentication"
        setupPrompt: "§6Add this account to an authenticator app (Google Authenticator, Aegis, …): click the setup link or the secret below to copy it, then paste it into the app. Enter the 6-digit code to confirm."
        link: "§7Setup link (click to copy): %s"
        secret: "§7Secret (click to copy): %s"
        codeLabel: "6-digit code"
        setupSubmit: "Enable 2FA"
        disableTitle: "Disable two-factor authentication"
        disablePrompt: "§6Enter a current 6-digit code to turn off two-factor authentication."
        disableSubmit: "Disable 2FA"
      register:
        title: "Registration"
        prompt: "§6Welcome! Create a password to register your account."
        password: "Password"
        passwordConfirm: "Repeat password"
        globalPassword: "Server password"
        submit: "Register"
      changePassword:
        title: "Change password"
        oldPassword: "Current password"
        newPassword: "New password"
        submit: "Change password"
      unregister:
        title: "Delete account"
        warning: "§cThis permanently deletes your account. You will be disconnected and must register again."
        password: "Password"
        confirm: "Delete account"
      online:
        title: "Mark as online account"
        warning: "§6Mark yourself as an online (premium) account. You will only be able to log in with a valid Mojang/Microsoft account, and data tied to your offline UUID (villager discounts, pets) will be lost."
        password: "Password"
        confirm: "Confirm"
      settings:
        title: "Settings"
        prompt: "§6Personal options.\n§7Session length is in seconds:\n§7• 0 = use the server default\n§7• -1 = ask for your password every time\n§7Values longer than the server limit are capped to it."
        sessionLabel: "Session length (seconds)"
        dialogLabel: "Show login window on join"
        submit: "Save"
      account:
        title: "Account"
        logoutButton: "Log out"
        usage: "§6Use /account changePassword, /account unregister, /account online, /account session <seconds> or /account dialog <true|false>."
        changePasswordTooltip: "Set a new password for your account."
        unregisterTooltip: "Permanently delete your account. You will be disconnected and must register again."
        onlineTooltip: "Switch to a premium (Mojang/Microsoft) account. Data tied to your offline UUID is lost."
        settingsTooltip: "Adjust your session length and whether the login window shows on join."
        logoutTooltip: "End your session now. You will need to log in again."
        otpEnableButton: "Enable 2FA"
        otpDisableButton: "Disable 2FA"
        otpEnableTooltip: "Protect your account with an authenticator app (two-factor authentication)."
        otpDisableTooltip: "Turn off two-factor authentication for your account."
      admin:
        title: "EasyAuth — Admin panel"
        usage: "§6Use /auth <subcommand>. Run /auth gui to open the panel."
        confirm: "§cAre you sure? This action cannot be undone."
        reload: "Reload config"
        list: "Registered players"
        onlinePlayers: "Online players"
        setSpawn: "Set spawn here"
        playerInfo: "Player info"
        getUuid: "Get UUID"
        markOffline: "Mark as offline"
        markOnline: "Mark as online"
        register: "Register player"
        update: "Update password"
        remove: "Remove account"
        setGlobalPassword: "Set global password"
        setUuid: "Set forced UUID"
        clearUuid: "Clear forced UUID"
        reloadTooltip: "Reload EasyAuth config files from disk."
        listTooltip: "List every registered player account."
        onlinePlayersTooltip: "Show which players are currently online."
        setSpawnTooltip: "Set the pre-login spawn point to your current position."
        playerInfoTooltip: "Show account details (UUID, status) for a player."
        getUuidTooltip: "Show the offline UUID generated for a username."
        markOfflineTooltip: "Force a player to authenticate as an offline (cracked) account."
        markOnlineTooltip: "Mark a player as a premium account so they skip the password prompt."
        registerTooltip: "Create an account for a player with a password you set."
        updateTooltip: "Change an existing player's password."
        removeTooltip: "Delete a player's account. This cannot be undone."
        setGlobalPasswordTooltip: "Set the shared server password used to register new accounts."
        setUuidTooltip: "Force a specific UUID for a player. They will be kicked to apply it."
        clearUuidTooltip: "Remove a player's forced UUID so they use the default again."
      field:
        username: "Username"
        password: "Password"
        uuid: "UUID"
        singleUse: "Single-use"
