text:
  easyauth:
    # Password
    password:
      enter: "§6Пожалуйста, введите пароль!"
      enterNew: "§4Пожалуйста, введите новый пароль!"
      incorrect: "§4Неверный пароль!"
      mismatch: "§6Пароли должны совпадать!"
      changed: "§aПароль успешно обновлён!"
      tooLong: "§6Максимальная длина пароля — %d символов!"
      tooShort: "§6Минимальная длина пароля — %d символов!"
      cannotChange: "§cВы не можете изменить пароль!"
      globalSet: "§aГлобальный пароль успешно установлен!"
      globalIncorrect: "§4Неверный глобальный пароль!"
    # Session
    session:
      loginRequired: "§cВы не авторизованы!\n§6Используйте /login или /l для входа."
      tooManyAttempts: "§4Слишком много попыток входа. Подождите немного и попробуйте снова."
      notAuthenticated: "§cВы не авторизованы!\n§6Используйте /login, /l или /register."
      alreadyAuthenticated: "§6Вы уже авторизованы."
      loginSuccess: "§aВы успешно авторизованы."
      logoutSuccess: "§aВы вышли из аккаунта."
      cannotLogout: "§cВы не можете выйти из аккаунта!"
      timeExpired: "§cВремя на авторизацию истекло."
      valid: "§aУ вас активная сессия. Вход не требуется."
      onlineAccount: "§aВы используете онлайн-аккаунт. Вход не требуется."
      otpRequired: "§6Этот аккаунт защищён двухфакторной аутентификацией.\n§6Введите /login <пароль> <код> с кодом из приложения-аутентификатора."
      otpIncorrect: "§4Неверный код двухфакторной аутентификации!"
    # Registration
    registration:
      required: "§6Введите /register <пароль> <пароль> для регистрации."
      requiredWithGlobalPassword: "§6Введите /register <глобальный пароль> <пароль> <пароль> для регистрации."
      premiumMustRegister: "§6Ваш аккаунт ещё не зарегистрирован на этом сервере. Введите /register <глобальный пароль> <пароль> <пароль> для регистрации."
      registrationDisabled: "§cРегистрация на этом сервере отключена."
      alreadyRegistered: "§6Этот аккаунт уже зарегистрирован!"
      success: "§aВы успешно авторизованы."
      notRegistered: "§cЭтот игрок не зарегистрирован!"
    # Account
    account:
      cannotUnregister: "§cВы не можете удалить этот аккаунт!"
      deleted: "§aВаш аккаунт успешно удалён!"
      dataDeleted: "§aДанные пользователя удалены."
      dataUpdated: "§aДанные пользователя обновлены."
      dataCorrupted: "§cВозможно, ваши данные повреждены. Обратитесь к администратору."
      usernameInvalid: "§6Никнейм содержит недопустимые символы! Разрешённый шаблон: %s"
      usernameCaseMismatch: "§6Вы используете другой регистр в никнейме. Пожалуйста, используйте правильный."
      alreadyOnline: "§cИгрок %s уже на сервере!"
      markedSelfOnline: "§aВы пометили себя как онлайн-игрока."
      markSelfOnlineWarning: "§6Вы собираетесь пометить себя как онлайн-игрока.\n§6Вы не сможете войти, если у вас нет онлайн-аккаунта.\n§6Данные, связанные с оффлайн UUID (скидки у жителей, питомцы и т.д.), будут утеряны.\n§aЕсли вы хотите продолжить, введите /account online <пароль> true."
      onlineNotFound: "§cОнлайн-аккаунт не найден."
      sessionCurrent: "§6Длина вашей сессии — %d секунд. (0 = значение сервера по умолчанию, -1 = вход каждый раз)"
      sessionSet: "§aДлина вашей сессии теперь %d секунд. (0 = значение сервера по умолчанию, -1 = вход каждый раз)\n§7Значения больше серверного лимита ограничиваются им."
      sessionInvalid: "§cДлина сессии должна быть целым числом секунд."
      dialogEnabled: "§aОкно входа будет показываться при подключении."
      dialogDisabled: "§aВместо окна будет использоваться вход через чат."
      settingsSaved: "§aВаши настройки сохранены."
      otpStatusEnabled: "§aДвухфакторная аутентификация включена для вашего аккаунта."
      otpStatusDisabled: "§6Двухфакторная аутентификация отключена. Введите /account otp enable, чтобы настроить её."
      otpFeatureDisabled: "§cДвухфакторная аутентификация отключена на этом сервере."
      otpAlreadyEnabled: "§6Двухфакторная аутентификация уже включена для вашего аккаунта."
      otpSetup: "§6Отсканируйте ссылку ниже в приложении-аутентификаторе (Google Authenticator, Aegis, …) или введите секрет вручную. Затем подтвердите командой /account otp enable <код>:"
      otpSecretLabel: "§7Секрет: "
      otpNoPending: "§6Сначала введите /account otp enable, чтобы начать настройку."
      otpInvalidCode: "§4Неверный код. Попробуйте ещё раз."
      otpEnabled: "§aДвухфакторная аутентификация теперь включена для вашего аккаунта."
      otpNotEnabled: "§6Двухфакторная аутентификация не включена для вашего аккаунта."
      otpDisabled: "§aДвухфакторная аутентификация отключена."
      otpReset: "§aДвухфакторная аутентификация сброшена для игрока §e%s§a."
    # Uuid
    uuid:
      offline: "Оффлайн UUID для игрока %s (нажмите для копирования):\n%s"
      forcedSet: "§aПринудительный UUID для игрока §e%s §aустановлен на §e%s§a. Игрок будет кикнут для применения изменений."
      forcedCleared: "§aПринудительный UUID для игрока §e%s §aсброшен. При следующем входе будет использован UUID по умолчанию."
      changed: "§6Ваш UUID был изменён администратором. Пожалуйста, переподключитесь."
      invalidFormat: "§cНеверный формат UUID: §e%s§c. Используйте формат: 12345678-1234-1234-1234-123456789abc"
      noForced: "§cУ игрока §e%s §cнет принудительно установленного UUID."
      collision: "§cUUID §e%s §cуже используется игроком §e%s§c."
    # Admin
    admin:
      configReloaded: "§aФайл конфигурации успешно перезагружен."
      spawnSet: "§aТочка спавна для входа успешно установлена."
      registeredPlayers: "Список зарегистрированных игроков:"
      markedOffline: "§aИгрок %s помечен как оффлайн."
      markedOnline: "§aИгрок %s помечен как онлайн."
      migrated: "§aДанные аккаунта и игрока перенесены с §e%s §aна §e%s§a."
      migrateSameName: "§cСтарый и новый никнеймы должны различаться."
      migratePlayerOnline: "§cОба игрока должны быть оффлайн. Кикните их перед переносом."
      migrateTargetExists: "§cУ игрока §e%s §cуже есть данные. Удалите их перед переносом."
      forceLoginOffline: "§cИгрок §e%s §cне в сети."
      forceLoginAlreadyAuthenticated: "§cИгрок §e%s §cуже авторизован."
      forceLoginSuccess: "§aИгрок §e%s §aпринудительно авторизован."
      ipLimitNotify: "§e[EasyAuth] §cПревышение лимита IP: §fИгрок §e%s §fс IP §e%s §fпревысил лимит в §e%d §fаккаунтов. Существующие аккаунты: §e%s"
      databaseUnavailable: "§e[EasyAuth] §4База данных недоступна после перезагрузки — вход и регистрация заблокированы, пока она не будет восстановлена."
    # Error
    error:
      unknown: "§4Произошла неизвестная ошибка."
      database: "§4Ошибка базы данных, подробности в консоли."
      hasher: "§4Ошибка хеширования, подробности в консоли."
      mojangUnavailable: "§cСервер Mojang недоступен. Повторите попытку позже."
      ipLimitExceeded: "§4Слишком много аккаунтов с вашего IP-адреса. Максимально допустимо: %d аккаунтов на один IP."
      sessionLimitExceeded: "§4Слишком много подключений с вашего IP-адреса. Попробуйте позже."
    # Dialog
    dialog:
      cancel: "Отмена"
      login:
        title: "Вход"
        prompt: "§6С возвращением! Введите пароль для входа."
        password: "Пароль"
        otp: "Код 2FA"
        submit: "Войти"
      otp:
        setupTitle: "Двухфакторная аутентификация"
        setupPrompt: "§6Добавьте этот аккаунт в приложение-аутентификатор (Google Authenticator, Aegis, …): нажмите на ссылку настройки или на секрет ниже, чтобы скопировать, и вставьте в приложение. Введите 6-значный код для подтверждения."
        link: "§7Ссылка настройки (нажмите для копирования): %s"
        secret: "§7Секрет (нажмите для копирования): %s"
        codeLabel: "6-значный код"
        setupSubmit: "Включить 2FA"
        disableTitle: "Отключить двухфакторную аутентификацию"
        disablePrompt: "§6Введите текущий 6-значный код, чтобы отключить двухфакторную аутентификацию."
        disableSubmit: "Отключить 2FA"
      register:
        title: "Регистрация"
        prompt: "§6Добро пожаловать! Придумайте пароль для регистрации аккаунта."
        password: "Пароль"
        passwordConfirm: "Повторите пароль"
        globalPassword: "Пароль сервера"
        submit: "Зарегистрироваться"
      changePassword:
        title: "Смена пароля"
        oldPassword: "Текущий пароль"
        newPassword: "Новый пароль"
        submit: "Сменить пароль"
      unregister:
        title: "Удаление аккаунта"
        warning: "§cЭто безвозвратно удалит ваш аккаунт. Вы будете отключены и должны будете зарегистрироваться заново."
        password: "Пароль"
        confirm: "Удалить аккаунт"
      online:
        title: "Пометить как онлайн-аккаунт"
        warning: "§6Пометить себя как онлайн-аккаунт (премиум). Вы сможете войти только с действительным аккаунтом Mojang/Microsoft, а данные, связанные с оффлайн UUID (скидки у жителей, питомцы), будут утеряны."
        password: "Пароль"
        confirm: "Подтвердить"
      settings:
        title: "Настройки"
        prompt: "§6Персональные настройки.\n§7Длина сессии указывается в секундах:\n§7• 0 = использовать значение сервера по умолчанию\n§7• -1 = запрашивать пароль каждый раз\n§7Значения больше серверного лимита ограничиваются им."
        sessionLabel: "Длина сессии (секунды)"
        dialogLabel: "Показывать окно входа при подключении"
        submit: "Сохранить"
      account:
        title: "Аккаунт"
        logoutButton: "Выйти"
        usage: "§6Используйте /account changePassword, /account unregister, /account online, /account session <секунды> или /account dialog <true|false>."
        changePasswordTooltip: "Установить новый пароль для аккаунта."
        unregisterTooltip: "Безвозвратно удалить ваш аккаунт. Вы будете отключены и должны будете зарегистрироваться заново."
        onlineTooltip: "Переключиться на премиум-аккаунт (Mojang/Microsoft). Данные, связанные с оффлайн UUID, будут утеряны."
        settingsTooltip: "Настроить длину сессии и показ окна входа при подключении."
        logoutTooltip: "Завершить сессию сейчас. Потребуется войти заново."
        otpEnableButton: "Включить 2FA"
        otpDisableButton: "Отключить 2FA"
        otpEnableTooltip: "Защитить аккаунт приложением-аутентификатором (двухфакторная аутентификация)."
        otpDisableTooltip: "Отключить двухфакторную аутентификацию для вашего аккаунта."
      admin:
        title: "EasyAuth — Панель администратора"
        usage: "§6Используйте /auth <подкоманда>. Введите /auth gui, чтобы открыть панель."
        confirm: "§cВы уверены? Это действие нельзя отменить."
        reload: "Перезагрузить конфиг"
        list: "Зарегистрированные игроки"
        onlinePlayers: "Игроки онлайн"
        setSpawn: "Установить спавн здесь"
        playerInfo: "Информация об игроке"
        getUuid: "Получить UUID"
        markOffline: "Пометить как оффлайн"
        markOnline: "Пометить как онлайн"
        register: "Зарегистрировать игрока"
        update: "Обновить пароль"
        remove: "Удалить аккаунт"
        setGlobalPassword: "Установить глобальный пароль"
        setUuid: "Установить принудительный UUID"
        clearUuid: "Сбросить принудительный UUID"
        migrate: "Перенести аккаунт"
        reloadTooltip: "Перезагрузить файлы конфигурации EasyAuth с диска."
        listTooltip: "Показать все зарегистрированные аккаунты игроков."
        onlinePlayersTooltip: "Показать, какие игроки сейчас онлайн."
        setSpawnTooltip: "Установить точку спавна до входа на вашу текущую позицию."
        playerInfoTooltip: "Показать данные аккаунта (UUID, статус) игрока."
        getUuidTooltip: "Показать оффлайн UUID, сгенерированный для никнейма."
        markOfflineTooltip: "Заставить игрока авторизоваться как оффлайн-аккаунт (пиратский)."
        markOnlineTooltip: "Пометить игрока как премиум-аккаунт, чтобы пропустить запрос пароля."
        registerTooltip: "Создать аккаунт для игрока с заданным вами паролем."
        updateTooltip: "Изменить пароль существующего игрока."
        removeTooltip: "Удалить аккаунт игрока. Это действие нельзя отменить."
        setGlobalPasswordTooltip: "Установить общий пароль сервера для регистрации новых аккаунтов."
        setUuidTooltip: "Принудительно задать UUID для игрока. Он будет кикнут для применения."
        clearUuidTooltip: "Удалить принудительный UUID игрока, чтобы снова использовался UUID по умолчанию."
        migrateTooltip: "Перенести аккаунт и его игровые данные на новый никнейм. Оба игрока должны быть оффлайн."
      field:
        username: "Никнейм"
        oldUsername: "Старый никнейм"
        newUsername: "Новый никнейм"
        password: "Пароль"
        uuid: "UUID"
        singleUse: "Одноразовый"
